[project]
name = "ruts"
version = "0.13.0.dev5"
description = "Russian Texts Statistics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Шкарин Сергей", email = "kouki.sergey@gmail.com" },
    { name = "Смирнова Екатерина", email = "ekanerina@yandex.ru" },
]
maintainers = [{ name = "Шкарин Сергей", email = "kouki.sergey@gmail.com" }]
keywords = [
    "NLP",
    "natural",
    "language",
    "processing",
    "CL",
    "computational",
    "linguistics",
    "text",
    "analytics",
    "russian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Natural Language :: Russian",
]
dependencies = [
    "graphviz>=0.20.3",
    "matplotlib>=3.8",
    "nltk>=3.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "pymorphy3>=2.0.4",
    "razdel>=0.5.0",
    "scipy>=1.11",
    "spacy>=3.7",
]

[project.urls]
Homepage = "https://github.com/SergeyShk/ruTS"
Repository = "https://github.com/SergeyShk/ruTS"
Documentation = "https://sergeyshk.github.io/ruTS/"
Issues = "https://github.com/SergeyShk/ruTS/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruts"]
exclude = ["ruts/datasets/data"]

[tool.hatch.build.targets.sdist]
include = ["ruts", "README.md", "README.en.md", "LICENSE.txt"]
exclude = ["ruts/datasets/data"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
ru-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl" }

[project.optional-dependencies]
fast = ["pymorphy3[fast]>=2.0.4"]

[dependency-groups]
test = ["pytest>=8.3", "pytest-cov>=6.0", "ru-core-news-sm"]
lint = ["mypy>=1.14", "pre-commit>=4.0", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["ruts", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["ruts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["ruts"]
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --doctest-modules"
testpaths = ["tests", "ruts"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "network: тест ходит в сеть; отключается через -m 'not network'",
]

[tool.coverage.run]
source = ["ruts"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
