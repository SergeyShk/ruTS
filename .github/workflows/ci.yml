name: build

on:
  push:
    branches:
      - master
  pull_request:

# Новый пуш в ветку отменяет предыдущий незавершённый прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: |
          uv run ruff check ruts tests
          uv run ruff format ruts tests --check
      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-punkt-stopwords-v1
      - name: Download NLTK data
        run: uv run python -m nltk.downloader punkt punkt_tab stopwords
      - name: Run tests
        run: uv run pytest --cov ruts --cov-fail-under 90 --cov-report xml
      - name: Send report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: ruts-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Загрузка покрытия не должна ронять сборку из-за перебоев на стороне Codecov
          fail_ci_if_error: false
          verbose: true
