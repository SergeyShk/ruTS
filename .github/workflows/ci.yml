name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: |
          uv run ruff check ruts tests demo examples conftest.py
          uv run ruff format ruts tests demo examples conftest.py --check
      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '--extra fast' || '' }}
      - name: Check DAWG extension
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python -c "from pymorphy3.dawg import EXTENSION_AVAILABLE; assert EXTENSION_AVAILABLE"
      - name: Cache NLTK data
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nltk_data
          key: nltk-punkt-stopwords-${{ runner.os }}-v1
      - name: Download NLTK data
        run: uv run python -m nltk.downloader -d "${{ runner.temp }}/nltk_data" punkt punkt_tab stopwords
      - name: Run tests
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data
        run: uv run pytest --cov ruts --cov-fail-under 90 --cov-report xml
      - name: Send report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: ruts-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --group docs
      - name: Build docs
        run: uv run mkdocs build --strict
