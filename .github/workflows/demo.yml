name: demo

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Pin ruts to the released version
        if: github.event_name == 'release'
        run: |
          sed -i 's|^ruts @ .*|ruts==${{ github.event.release.tag_name }}|' demo/requirements.txt
          for attempt in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/ruts/${{ github.event.release.tag_name }}/json" > /dev/null && exit 0
            sleep 30
          done
          echo "ruts ${{ github.event.release.tag_name }} is not on PyPI" && exit 1
      - name: Upload demo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uvx --from huggingface_hub hf upload SergeyShk/ruTS demo . --repo-type space --commit-message "Update demo to ${{ github.ref_name }}"
