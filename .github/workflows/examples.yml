name: examples

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Cache NLTK data
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nltk_data
          key: nltk-punkt-stopwords-${{ runner.os }}-v1
      - name: Download NLTK data
        run: uv run python -m nltk.downloader -d "${{ runner.temp }}/nltk_data" punkt punkt_tab stopwords
      - name: Run notebooks
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data
        run: uv run pytest --nbmake examples -p no:cacheprovider
