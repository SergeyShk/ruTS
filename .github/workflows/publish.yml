name: publish

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build distribution
        run: uv build
      - name: Check distribution
        run: |
          uv tool run twine check dist/*
          ls -l dist
      - name: Publish distribution (test)
        if: github.event_name == 'push'
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.TEST_PYPI_LOGIN }}
          UV_PUBLISH_PASSWORD: ${{ secrets.TEST_PYPI_PASS }}
        run: uv publish --index testpypi
      - name: Publish distribution
        if: github.event_name == 'release'
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_LOGIN }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_PASS }}
        run: uv publish
