name: publish

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Check version matches tag
        run: |
          version="$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Версия в pyproject.toml ($version) не совпадает с тегом ($GITHUB_REF_NAME)"
            exit 1
          fi
      - name: Build distribution
        run: uv build
      - name: Check distribution
        run: |
          uv tool run twine check dist/*
          ls -l dist
      - name: Check wheel install
        run: >-
          uv run --isolated --no-project --with dist/*.whl python -c
          "import ruts; from ruts.lexical_stats import get_rank; get_rank('кот');
          ruts.CohesionStats('Кот спит. Кот ест.').get_stats(); ruts.StyleStats('Кот спит.').get_stats()"
      - name: Publish distribution (test)
        if: github.event_name == 'push'
        run: uv publish --index testpypi --trusted-publishing always
      - name: Publish distribution
        if: github.event_name == 'release'
        run: uv publish --trusted-publishing always
