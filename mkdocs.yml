site_name: RuTS
site_description: "Библиотека для извлечения статистик из текстов на русском языке"
repo_url: https://github.com/SergeyShk/ruTS

nav:
    - Главная:
      - О проекте: index.md
      - Установка: installation.md
      - Исключения и логирование: errors.md
      - Авторы: authors.md
    - Извлечение объектов:
      - Извлечение предложений: extractors/sentences.md
      - Извлечение слов: extractors/words.md
      - Извлечение символьных N-грамм: extractors/char_ngrams.md
    - Подсчет статистик:
        - Базовые статистики: stats/basic_stats.md
        - Метрики удобочитаемости:
          - Модуль вычисления метрик: stats/readability_stats.md
          - Функции вычисления метрик: stats/readability_stats_funcs.md
        - Метрики лексического разнообразия:
          - Модуль вычисления метрик: stats/diversity_stats.md
          - Функции вычисления метрик: stats/diversity_stats_funcs.md
        - Морфологические статистики: stats/morph_stats.md
        - SEO-метрики стиля:
          - Модуль вычисления метрик: stats/style_stats.md
          - Функции вычисления метрик: stats/style_stats_funcs.md
        - Фоностатистики:
          - Модуль вычисления статистик: stats/phon_stats.md
          - Функции вычисления статистик: stats/phon_stats_funcs.md
        - Синтаксические статистики:
          - Модуль вычисления статистик: stats/syntax_stats.md
          - Функции вычисления статистик: stats/syntax_stats_funcs.md
        - Статистики связности:
          - Модуль вычисления статистик: stats/cohesion_stats.md
          - Функции вычисления статистик: stats/cohesion_stats_funcs.md
        - Статистики лексической сложности:
          - Модуль вычисления статистик: stats/lexical_stats.md
          - Функции вычисления статистик: stats/lexical_stats_funcs.md
    - Корпусные меры:
        - Ключевые слова: corpus/keyness.md
        - Коллокации: corpus/collocations.md
        - Дисперсия слов: corpus/dispersion.md
        - Конкорданс KWIC: corpus/kwic.md
        - Стилометрия: corpus/stylometry.md
        - Сравнение корпусов: corpus/compare.md
    - Наборы данных:
        - Советские христоматии (литература): datasets/sovchlit.md
        - Полное собрание сочинений И.В. Сталина: datasets/stalinworks.md
        - Тексты с метками класса: datasets/textsbygrade.md
        - Частотный словарь Ляшевской и Шарова: datasets/freq2011.md
        - Корпус русской поэзии: datasets/poetrycorpus.md
        - Русская классическая литература: datasets/russianliterature.md
    - Визуализации:
        - Закон Ципфа: visualizers/zipf.md
        - Литературная дактилоскопия: visualizers/fingerprinting.md
        - Дерево слов: visualizers/word_tree.md
        - Подсветка текста: visualizers/highlight.md
        - Корпусные графики: visualizers/corpus.md
        - Стилометрические графики: visualizers/stylometry.md
        - Рост словаря и спектр частот: visualizers/vocabulary.md
        - Длины предложений: visualizers/sentences.md
    - Компоненты:
        - Компоненты: components.md

theme:
  name: material
  language: ru
  palette:
    primary: blue
    accent: blue
  font:
    text: Source Sans Pro
  features:
    - navigation.tabs
    - navigation.instant

plugins:
  - search:
      lang:
        - ru
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergeyShk
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/shk_sergey
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kouki91/

extra_css:
  - css/mermaid.css
  - css/extra.css

extra_javascript:
  - js/config.js
  - js/mermaid.min.js
  - js/mathjax/tex-svg.js

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - admonition
  - codehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.arithmatex:
      generic: True
